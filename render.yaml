# Render Blueprint — one-click deploy of the full RecoverAI stack.
# Dashboard → New → Blueprint → point at this repo. Render provisions
# PostgreSQL + backend + frontend, then runs migrations + demo seed.
#
# After the first deploy, open https://recoverai-frontend.onrender.com/login
# and sign in with the demo account below (synthetic showcase data only).
# If you renamed the services, update the two URLs to match.
services:
  - type: web
    name: recoverai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head && python scripts/seed_if_empty.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: WARNING
      - key: DATABASE_URL
        fromDatabase:
          name: recoverai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: '["https://recoverai-frontend.onrender.com"]'
      - key: DEMO_AUTH_ENABLED
        value: "true"
      - key: DEMO_MERCHANT_EMAIL
        value: demo@recoverai.local
      - key: DEMO_MERCHANT_PASSWORD
        value: RecoverAI-hackathon-demo-2026
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  - type: web
    name: recoverai-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile.prod
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://recoverai-backend.onrender.com
      - key: NEXT_PUBLIC_DEMO_EMAIL
        value: demo@recoverai.local
      - key: NEXT_PUBLIC_DEMO_PASSWORD
        value: RecoverAI-hackathon-demo-2026

databases:
  - name: recoverai-db
    databaseName: recoverai
    user: recoverai
