# TLS-terminating reverse proxy in front of frontend (:3000) and backend (:8000).
# Terminate TLS here; restrict CORS in backend to the public frontend origin.
server {
  listen 443 ssl;
  server_name api.example.com;

  # ssl_certificate /etc/nginx/tls/fullchain.pem;
  # ssl_certificate_key /etc/nginx/tls/privkey.pem;

  location / {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /api/v1/webhooks/razorpay {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    # Razorpay signs the raw body: do not transform it.
    proxy_pass_request_headers on;
  }
}
